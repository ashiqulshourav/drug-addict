<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="নির্দিষ্ট এলাকা, থানা বা জেলার মাদক সংক্রান্ত স্পট ও পরিসংখ্যান বিবরণী।" />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="লোকেশন বিবরণী - মাদক" />
    <meta property="og:description" content="নির্দিষ্ট এলাকা, থানা বা জেলার মাদক সংক্রান্ত স্পট ও পরিসংখ্যান বিবরণী।" />
    <meta property="og:locale" content="bn_BD" />
    <meta name="twitter:card" content="summary" />
    <title>লোকেশন - মাদক</title>
    <link rel="stylesheet" href="./assets/css/app.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      crossorigin=""
    />
    <style>
      body {
        font-family: "Noto Sans Bengali", Arial, sans-serif;
      }
      .map-loading {
        cursor: wait;
        opacity: 0.7;
      }
      .custom-marker {
        width: 35px;
        height: 35px;
        display: grid;
        place-items: center;
        border: 3px solid white;
        border-radius: 50% 50% 50% 0;
        transform: rotate(-45deg);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.25);
      }
      .custom-marker span {
        color: white;
        transform: rotate(45deg);
        font-weight: 800;
      }
      .filter-btn.active {
        background: #5b46e8 !important;
        color: #fff !important;
        box-shadow: 0 2px 7px rgba(91, 70, 232, 0.22);
      }
      .filter-btn:not(.active) {
        background: #f1f5f9 !important;
        color: #475569 !important;
      }
      .modal-open {
        display: flex !important;
      }
    </style>
  </head>
  <body class="m-0 bg-slate-50 text-slate-800">
    <header
      class="sticky top-0 z-[1001] border-b border-slate-200/80 bg-white/90 backdrop-blur-xl shadow-md"
    >
      <div
        class="mx-auto flex min-h-[76px] w-[min(1180px,calc(100%-32px))] items-center justify-between gap-4"
      >
        <a href="./" class="flex items-center gap-2.5 no-underline"
          ><span
            class="grid h-10 w-10 place-items-center rounded-xl bg-[#951d1f] text-xl font-extrabold text-white"
            >M</span
          ><strong class="text-2xl text-[#951d1f]">মাদক</strong></a
        >
        <div class="flex items-center gap-3 md:gap-4">
          <div
            id="globalSearchArea"
            class="relative w-full md:w-64"
          >
            <button
              id="globalSearchToggle"
              type="button"
              aria-label="সার্চ খুলুন"
              class="hidden h-10 w-10 items-center justify-center rounded-lg border border-slate-200 bg-white text-lg text-slate-600"
            >
              ⌕
            </button>
            <input
              id="globalSearch"
              type="search"
              autocomplete="off"
              placeholder="বিভাগ, জেলা বা উপজেলা খুঁজুন"
              class="h-10 w-full rounded-lg border border-slate-200 bg-white px-3 text-xs outline-none"
            />
            <div
              id="globalSearchResults"
              class="absolute left-0 right-0 top-11 z-[1100] hidden max-h-80 overflow-y-auto rounded-lg border border-slate-200 bg-white shadow-xl"
            ></div>
          </div>
          <button
            id="openReportBtn"
            type="button"
            class="inline-flex min-h-11 items-center justify-center gap-1.5 rounded-[11px] bg-[#5b46e8] px-4 text-sm font-bold text-white shadow-lg shadow-[#5b46e8]/20 transition hover:-translate-y-px grow min-w-fit"
          >
            + লোকেশন রিপোর্ট করুন
          </button>
        </div>
      </div>
    </header>
    <main class="mx-auto w-[min(1180px,calc(100%-32px))] py-8">
      <div id="locationHeading" class="mb-6"></div>
      <div
        id="locationStats"
        class="mb-6 grid grid-cols-2 gap-3 md:grid-cols-4"
      ></div>
      <section
        class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm"
      >
        <div
          class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-100 p-4"
        >
          <h2 class="text-base font-extrabold">লোকেশনের মানচিত্র</h2>
          <div class="flex items-center gap-2">
            <button
              class="filter-btn active rounded-lg px-3 py-2 text-xs font-bold"
              data-filter="all"
            >
              সব
            </button>
            <button
              class="filter-btn rounded-lg px-3 py-2 text-xs font-bold"
              data-filter="sale"
            >
              বেচাকেনা
            </button>
            <button
              class="filter-btn rounded-lg px-3 py-2 text-xs font-bold"
              data-filter="use"
            >
              সেবন
            </button>
          </div>
        </div>
        <div class="relative">
          <div id="locationMap" class="h-[380px] w-full md:h-[500px]"></div>
          <button
            id="locationLocateBtn"
            type="button"
            title="আমার বর্তমান অবস্থান"
            class="absolute bottom-4 right-3 z-[500] grid h-10 w-10 place-items-center rounded-xl border border-slate-200 bg-black/95 text-white shadow-xl"
          >
            <span
              class="rounded-full border-[3px] border-white bg-[#5b46e8] p-1"
            ></span>
          </button>
          <div
            class="absolute bottom-4 left-3 z-[500] flex flex-wrap gap-3 rounded-lg bg-white/95 px-3 py-2 text-[10px] font-bold shadow-xl md:text-[12px]"
          >
            <div>
              <span
                class="mr-1 inline-block h-2 w-2 rounded-full bg-red-500"
              ></span
              >মাদক বেচাকেনা
            </div>
            <div>
              <span
                class="mr-1 inline-block h-2 w-2 rounded-full bg-yellow-400"
              ></span
              >মাদক সেবন
            </div>
            <div>
              <span
                class="mr-1 inline-block h-2 w-2 rounded-full bg-green-500"
              ></span
              >উভয়
            </div>
          </div>
        </div>
      </section>
      <p id="locationError" class="mt-4 text-sm text-red-600"></p>
    </main>
    <footer class="mt-8 bg-[#121625] py-7 text-white">
      <div
        class="mx-auto flex w-[min(1180px,calc(100%-32px))] flex-col items-start justify-between gap-3 md:flex-row md:items-center"
      >
        <div>
          <strong>Madok</strong>
          <p class="m-0 text-[10px] text-slate-400 md:text-xs">
            A location reporting platform
          </p>
        </div>
        <span class="text-[10px] text-slate-400 md:text-xs"
          >A product of
          <a
            href="https://devnotation.com"
            target="_blank"
            rel="noopener noreferrer"
            class="text-[#5b46e8]"
            >Devnotation</a
          ></span
        >
      </div>
      <div class="mt-2 text-center">
        <span class="text-[10px] text-slate-400 md:text-xs"
          >&copy; 2026 Devnotation. All rights reserved.</span
        >
      </div>
    </footer>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      crossorigin=""
    ></script>
    <script src="./assets/js/search.js?v=1.0.1"></script>
    <script src="./assets/js/report-form.js?v=2.2.0"></script>
    <script src="./assets/js/visitor.js?v=1.0.0"></script>
    <script>
      (() => {
        const appBase = location.pathname.replace(/\/[^/]*$/, "");
        const params = new URLSearchParams(location.search);
        const type = params.get("type");
        const slug = params.get("slug");
        const esc = (v) =>
          String(v ?? "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
        const heading = document.getElementById("locationHeading");
        const stats = document.getElementById("locationStats");
        const error = document.getElementById("locationError");
        let map;
        let allLocations = [];
        let markers = [];
        let activeFilter = "all";
        const typeColor = (t) =>
          t === "sale" ? "#ef4444" : t === "use" ? "#facc15" : "#22c55e";
        const markerIcon = (t) =>
          L.divIcon({
            className: "",
            html: `<div class="custom-marker" style="background:${typeColor(t)}"><span>${t === "sale" ? "↗" : "●"}</span></div>`,
            iconSize: [35, 35],
            iconAnchor: [17, 35],
            popupAnchor: [0, -34],
          });
        /* Same popup markup as the home page map. */
        const buildPopup = (item) =>
          typeof window.MadokPopup?.buildLocationPopup === "function"
            ? window.MadokPopup.buildLocationPopup(item, appBase)
            : `<strong>${esc(item.title)}</strong><br>${Number(item.reports).toLocaleString("en-US")} রিপোর্ট`;
        const card = (label, value) =>
          `<article class="rounded-xl border border-slate-200 bg-white p-4"><span class="text-xs text-slate-500">${label}</span><strong class="mt-1 block text-2xl font-extrabold">${Number(value || 0).toLocaleString("en-US")}</strong></article>`;
        const drawMarkers = () => {
          markers.forEach((m) => map.removeLayer(m));
          markers = [];
          allLocations
            .filter(
              (item) =>
                activeFilter === "all" ||
                item.type === activeFilter ||
                item.type === "both",
            )
            .forEach((item) => {
              const marker = L.marker([item.lat, item.lng], {
                icon: markerIcon(item.type),
              })
                .addTo(map)
                .bindPopup(buildPopup(item));
              markers.push(marker);
            });
        };
        const load = async () => {
          if (!type || !slug) throw Error("Location পাওয়া যায়নি।");
          const r = await fetch(
            `${appBase}/api/location.php?type=${encodeURIComponent(type)}&slug=${encodeURIComponent(slug)}`,
            { headers: { Accept: "application/json" }, cache: "no-store" },
          );
          const x = await r.json();
          if (!r.ok || !x.ok) throw Error(x.message || "Location load failed");
          const p = x.location;
          allLocations = x.locations || [];
          heading.innerHTML = `<p class="text-xs font-bold tracking-widest text-[#5b46e8]">${esc(type === "division" ? "বিভাগ" : type === "district" ? "জেলা" : "উপজেলা / থানা")}</p><h1 class="mt-1 text-3xl font-extrabold">${esc(type === "division" ? p.division : type === "district" ? p.district : p.upazila)}</h1><p class="mt-2 text-sm text-slate-500">${esc([p.upazila !== p.district ? p.district : "", p.division].filter(Boolean).join(" · "))}</p>`;
          stats.innerHTML =
            card("মোট রিপোর্ট", p.reports) +
            card("চিহ্নিত লোকেশন", p.locations);
          map = L.map("locationMap").setView(
            allLocations[0]
              ? [allLocations[0].lat, allLocations[0].lng]
              : [23.8103, 90.4125],
            allLocations.length ? 11 : 7,
          );
          L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution: "&copy; OpenStreetMap",
          }).addTo(map);
          drawMarkers();
          map.on("click", (e) => {
            window.MadokReportForm?.open(e.latlng.lat, e.latlng.lng);
          });
        };
        document.querySelectorAll(".filter-btn").forEach((button) =>
          button.addEventListener("click", () => {
            activeFilter = button.dataset.filter;
            document
              .querySelectorAll(".filter-btn")
              .forEach((item) =>
                item.classList.toggle("active", item === button),
              );
            drawMarkers();
          }),
        );
        document.getElementById("locationLocateBtn").onclick = () => {
          const b = document.getElementById("locationLocateBtn");
          if (b.disabled || !map) return;
          const html = b.innerHTML;
          b.disabled = true;
          b.classList.add("map-loading");
          b.innerHTML =
            '<span class="animate-spin rounded-full border-[3px] border-white/40 border-t-white p-1"></span>';
          const restore = () => {
            b.disabled = false;
            b.classList.remove("map-loading");
            b.innerHTML = html;
          };

          /* Instant jump when a recent fix is already cached. */
          const cached = window.MadokGeo?.cached?.();
          if (cached) {
            map.setView([cached.lat, cached.lng], 16, { animate: true });
            restore();
            return;
          }

          const locate = window.MadokGeo?.locate;
          if (typeof locate !== "function" || !navigator.geolocation) {
            restore();
            return;
          }

          locate(
            (lat, lng) => {
              map.setView([lat, lng], 16, { animate: true });
              restore();
            },
            restore,
          );
        };
        load().catch((e) => (error.textContent = e.message));
      })();
    </script>
  </body>
</html>
