<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="মাদক সংক্রান্ত সকল নাগরিক রিপোর্ট, যাচাই এবং কমিউনিটি মতামত তালিকা।"
    />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Madok - সব রিপোর্ট" />
    <meta
      property="og:description"
      content="মাদক সংক্রান্ত সকল নাগরিক রিপোর্ট, যাচাই এবং কমিউনিটি মতামত তালিকা।"
    />
    <meta property="og:locale" content="bn_BD" />
    <meta name="twitter:card" content="summary" />
    <title>Madok - সব রিপোর্ট</title>
    <link rel="stylesheet" href="../assets/css/app.css?v=1.0.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      crossorigin=""
    />
    <style>
      body {
        font-family: "Noto Sans Bengali", Arial, sans-serif;
      }
      .custom-marker {
        width: 35px;
        height: 35px;
        display: grid;
        place-items: center;
        border: 3px solid white;
        border-radius: 50% 50% 50% 0;
        transform: rotate(-45deg);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.25);
      }
      .custom-marker span {
        color: white;
        transform: rotate(45deg);
        font-weight: 800;
      }
      .custom-marker.marker-blink {
        animation: markerBlink 1s ease-in-out infinite;
      }
      @keyframes markerBlink {
        0%,
        100% {
          opacity: 1;
          transform: rotate(-45deg) scale(1);
        }
        50% {
          opacity: 0.4;
          transform: rotate(-45deg) scale(1.35);
        }
      }
      .filter-btn.active {
        background: #5b46e8 !important;
        color: #fff !important;
      }
      .filter-btn:not(.active) {
        background: #f1f5f9 !important;
        color: #475569 !important;
      }
      .map-locate-loading {
        cursor: wait;
        opacity: 0.7;
      }
      .modal-open {
        display: flex !important;
      }
    </style>
  </head>
  <body class="m-0 bg-slate-50 text-slate-800">
    <header
      class="sticky top-0 z-[1001] border-b border-slate-200/80 bg-white/90 backdrop-blur-xl shadow-md"
    >
      <div
        class="mx-auto flex min-h-[76px] w-[min(900px,calc(100%-32px))] items-center justify-between gap-4"
      >
        <a href="../" class="flex items-center gap-2.5 no-underline">
          <span
            class="grid h-10 w-10 place-items-center rounded-xl bg-[#951d1f] text-xl font-extrabold text-white"
            >M</span
          >
          <span
            ><strong
              class="block lg:text-lg text-2xl leading-none text-[#951d1f]"
              >মাদক</strong
            ></span
          >
        </a>
        <div class="flex items-center gap-3 md:gap-4">
          <div id="globalSearchArea" class="relative w-full md:w-64">
            <button
              id="globalSearchToggle"
              type="button"
              aria-label="সার্চ খুলুন"
              class="hidden h-10 w-10 items-center justify-center rounded-lg border border-slate-200 bg-white text-lg text-slate-600"
            >
              ⌕
            </button>
            <input
              id="globalSearch"
              type="search"
              autocomplete="off"
              placeholder="বিভাগ, জেলা বা উপজেলা খুঁজুন"
              class="h-10 w-full rounded-lg border border-slate-200 bg-white px-3 text-xs outline-none focus:border-[#5b46e8]"
            />
            <div
              id="globalSearchResults"
              class="absolute left-0 right-0 top-11 z-[1100] hidden max-h-80 overflow-y-auto rounded-lg border border-slate-200 bg-white shadow-xl"
            ></div>
          </div>
          <button
            id="openReportBtn"
            type="button"
            class="inline-flex min-h-11 items-center justify-center gap-1.5 rounded-[11px] bg-[#5b46e8] px-4 text-sm font-bold text-white shadow-lg shadow-[#5b46e8]/20 transition hover:-translate-y-px grow min-w-fit"
          >
            + লোকেশন রিপোর্ট করুন
          </button>
        </div>
      </div>
    </header>

    <main
      class="mx-auto min-h-[calc(100vh-190px)] w-[min(900px,calc(100%-32px))] py-10"
    >
      <div id="locationSummary" class="mb-6"></div>
      <div id="reportsList" class="space-y-4">
        <p class="text-sm text-slate-500">রিপোর্ট লোড হচ্ছে...</p>
      </div>
      <section
        class="mt-8 overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm"
      >
        <div
          class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-100 p-4"
        >
          <div>
            <h2 class="text-base font-extrabold">রিপোর্টের মানচিত্র</h2>
            <p class="text-xs text-slate-500">সব রিপোর্টের লোকেশন দেখুন</p>
          </div>
          <div class="flex items-center gap-2">
            <button
              class="filter-btn active rounded-lg px-3 py-2 text-xs font-bold"
              data-filter="all"
            >
              সব
            </button>
            <button
              class="filter-btn rounded-lg px-3 py-2 text-xs font-bold"
              data-filter="sale"
            >
              বেচাকেনা
            </button>
            <button
              class="filter-btn rounded-lg px-3 py-2 text-xs font-bold"
              data-filter="use"
            >
              সেবন
            </button>
          </div>
        </div>
        <div class="relative">
          <div id="reportsMap" class="h-[360px] w-full md:h-[430px]"></div>
          <button
            id="mapLocateBtn"
            type="button"
            title="আমার বর্তমান অবস্থান"
            aria-label="আমার বর্তমান অবস্থান"
            class="absolute bottom-4 right-3 z-[500] grid h-10 w-10 place-items-center rounded-xl border border-slate-200 bg-black/95 text-white shadow-xl disabled:cursor-wait"
          >
            <span
              class="rounded-full border-[3px] border-white bg-[#5b46e8] p-1"
            ></span>
          </button>
          <div
            class="absolute bottom-4 left-3 z-[500] flex flex-wrap gap-3 rounded-lg bg-white/95 px-3 py-2 text-[10px] font-bold shadow-xl md:text-[12px]"
          >
            <div>
              <span
                class="mr-1 inline-block h-2 w-2 rounded-full bg-red-500"
              ></span
              >মাদক বেচাকেনা
            </div>
            <div>
              <span
                class="mr-1 inline-block h-2 w-2 rounded-full bg-yellow-400"
              ></span
              >মাদক সেবন
            </div>
            <div>
              <span
                class="mr-1 inline-block h-2 w-2 rounded-full bg-green-500"
              ></span
              >উভয়
            </div>
          </div>
        </div>
      </section>

    <footer class="bg-[#121625] py-7 text-white">

    <div
      id="imageModal"
      class="fixed inset-0 z-[2000] hidden items-center justify-center bg-black/70 p-4"
    >
      <div
        class="relative max-h-[90vh] w-full max-w-3xl rounded-2xl bg-white p-3 shadow-2xl"
      >
        <button
          id="closeImageModal"
          class="absolute right-3 top-3 z-10 rounded-full bg-black/70 px-3 py-1 text-lg text-white"

          ×</button

    <div
      id="editModal"
      class="fixed inset-0 z-[2100] hidden items-center justify-center bg-black/50 p-4"
    >
      <form
        id="editForm"
        class="w-full max-w-lg rounded-2xl bg-white p-6 shadow-2xl"
      >
        <div class="mb-5 flex items-center justify-between">
          <h2 class="text-lg font-extrabold">রিপোর্ট edit করুন</h2>
          <button
            type="button"
            id="closeEditModal"
            class="text-2xl text-slate-400"
          >
            ×
          </button>
        </div>
        <input type="hidden" name="reportId" /><label
          class="mb-4 block text-sm font-bold"
          >শিরোনাম<input
            name="title"
            required
            maxlength="160"
            class="mt-2 w-full rounded-lg border border-slate-200 px-3 py-2" /></label
        ><label class="mb-4 block text-sm font-bold"
          >বিবরণ<textarea
            name="description"
            maxlength="1000"
            rows="4"
            class="mt-2 w-full rounded-lg border border-slate-200 px-3 py-2"
          ></textarea></label
        ><label class="mb-5 block text-sm font-bold"
          >নতুন ছবি<input
            name="image"
            type="file"
            accept="image/jpeg,image/png,image/webp"
            class="mt-2 block w-full text-sm" /></label
        ><label class="mb-5 flex items-center gap-2 text-sm"
          ><input name="removeImage" type="checkbox" value="1" /> বর্তমান ছবি
          মুছে দিন</label

        <div class="flex justify-end gap-2">
          <button
            type="button"
            id="deleteReportBtn"
            class="mr-auto rounded-lg bg-red-50 px-4 py-2 text-sm font-bold text-red-700"
          >
            ডিলিট</button
          ><button
            type="button"
            id="cancelEditBtn"
            class="rounded-lg border border-slate-200 px-4 py-2 text-sm font-bold"

            বাতিল</button

            class="rounded-lg bg-[#5b46e8] px-4 py-2 text-sm font-bold text-white"

            Update

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      crossorigin=""
    ></script>
    <script src="../assets/js/search.js?v=1.0.1"></script>
    <script src="../assets/js/report-form.js?v=2.2.0"></script>
    <script src="../assets/js/visitor.js?v=1.0.0"></script>
    <script>
      const escapeHtml = (value) =>
        String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      const typeLabel = (type) =>
        type === "sale" ? "মাদক বেচাকেনা" : "মাদক সেবন";
      const typeStyles = (type) =>
        type === "sale"
          ? "bg-red-50 text-red-700"
          : "bg-yellow-50 text-yellow-700";
      const params = new URLSearchParams(location.search);
      const cleanRouteMatch = location.pathname.match(
        /\/reports\/(?:location=)?([0-9]+)\/?$/i,
      );
      const locationId = params.get("location") || cleanRouteMatch?.[1];
      const appBase = location.pathname.includes("/reports/")
        ? location.pathname.split("/reports/")[0]
        : location.pathname.replace(/\/[^/]*$/, "");
      let csrfToken = "";
      const securityReady = fetch(`${appBase}/api/security.php`, {
        headers: { Accept: "application/json" },
        cache: "no-store",
      }).then(async (response) => {
        const result = await response.json();
        if (!response.ok || !result.ok)
          throw new Error("Security initialization failed");
        csrfToken = result.csrf_token;
      });
      const imageUrl = (imagePath) => {
        if (!imagePath) return "";
        if (/^(?:https?:)?\/\//i.test(imagePath) || imagePath.startsWith("/")) {
          return imagePath;
        }
        return `${appBase}/${imagePath.replace(/^\/+/, "")}`;
      };
      const summary = document.getElementById("locationSummary");
      const list = document.getElementById("reportsList");
      const mapElement = document.getElementById("reportsMap");
      let reports = [];
      let allLocations = [];
      let activeFilter = "all";
      let reportsMap = null;
      let reportMarkers = [];
      let focusMarker = null;
      let editingReport = null;
      let reportedLocation = null;

      const typeColor = (type) =>
        type === "sale" ? "#ef4444" : type === "use" ? "#facc15" : "#22c55e";
      const markerIcon = (type, blink = false) =>
        L.divIcon({
          className: "",
          html: `<div class="custom-marker${blink ? " marker-blink" : ""}" style="background:${typeColor(type)}"><span>${type === "sale" ? "↗" : "●"}</span></div>`,
          iconSize: [35, 35],
          iconAnchor: [17, 35],
          popupAnchor: [0, -34],
        });
      /* Same popup markup as the home page map. */
      const buildPopup = (item) =>
        typeof window.MadokPopup?.buildLocationPopup === "function"
          ? window.MadokPopup.buildLocationPopup(item, appBase)
          : `<strong>${escapeHtml(item.title)}</strong><br><span>${Number(item.reports).toLocaleString("en-US")} রিপোর্ট</span>`;
      const setModal = (element, open) => {
        element.classList.toggle("hidden", !open);
        element.classList.toggle("flex", open);
      };
      function drawMarkers() {
        reportMarkers.forEach((marker) => reportsMap.removeLayer(marker));
        reportMarkers = [];
        focusMarker = null;
        allLocations
          .filter(
            (item) =>
              activeFilter === "all" ||
              item.type === activeFilter ||
              item.type === "both",
          )
          .forEach((item) => {
            const isFocus =
              reportedLocation && String(item.id) === String(locationId);
            const marker = L.marker([Number(item.lat), Number(item.lng)], {
              icon: markerIcon(item.type, isFocus),
              zIndexOffset: isFocus ? 1000 : 0,
            }).addTo(reportsMap);
            marker.bindPopup(buildPopup(item));
            if (isFocus) {
              focusMarker = marker;
              marker.openPopup();
            }
            reportMarkers.push(marker);
          });
        if (focusMarker) {
          setTimeout(() => {
            const el = focusMarker
              .getElement()
              ?.querySelector(".custom-marker");
            if (el) {
              el.classList.remove("marker-blink");
              void el.offsetWidth;
              el.classList.add("marker-blink");
            }
          }, 100);
        }
      }
      function initReportsMap() {
        const initialCenter = reportedLocation
          ? [reportedLocation.lat, reportedLocation.lng]
          : [23.8103, 90.4125];
        reportsMap = L.map(mapElement).setView(
          initialCenter,
          reportedLocation ? 14 : 7,
        );
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 19,
          attribution: "&copy; OpenStreetMap",
        }).addTo(reportsMap);
        reportsMap.on("click", (event) => {
          window.MadokReportForm?.open(event.latlng.lat, event.latlng.lng);
        });
        drawMarkers();
        setTimeout(() => reportsMap.invalidateSize(), 150);
      }
      function locateUser() {
        const button = document.getElementById("mapLocateBtn");
        if (!button || button.disabled || !reportsMap) return;
        const original = button.innerHTML;
        button.disabled = true;
        button.classList.add("map-locate-loading");
        button.innerHTML =
          '<span class="animate-spin rounded-full border-[3px] border-white/40 border-t-white p-1" aria-label="লোড হচ্ছে"></span>';
        const restore = () => {
          button.disabled = false;
          button.classList.remove("map-locate-loading");
          button.innerHTML = original;
        };

        /* Instant jump when a recent fix is already cached. */
        const cached = window.MadokGeo?.cached?.();
        if (cached) {
          reportsMap.setView([cached.lat, cached.lng], 16, { animate: true });
          restore();
          return;
        }

        const locate = window.MadokGeo?.locate;
        if (typeof locate !== "function" || !navigator.geolocation) {
          restore();
          alert("আপনার বর্তমান লোকেশন পাওয়া যায়নি।");
          return;
        }

        locate(
          (lat, lng) => {
            reportsMap.setView([lat, lng], 16, { animate: true });
            restore();
          },
          () => {
            restore();
            alert("আপনার বর্তমান লোকেশন পাওয়া যায়নি।");
          },
        );
      }
      function openImage(path) {
        document.getElementById("modalImage").src = imageUrl(path);
        setModal(document.getElementById("imageModal"), true);
      }
      function openEdit(report) {
        editingReport = report;
        const form = document.getElementById("editForm");
        form.reportId.value = report.id;
        form.title.value = report.title;
        form.description.value = report.description || "";
        form.removeImage.checked = false;
        form.image.value = "";
        document.getElementById("editError").textContent = "";
        setModal(document.getElementById("editModal"), true);
      }
      async function saveEdit(event) {
        event.preventDefault();
        await securityReady;
        const form = event.currentTarget;
        const data = new FormData(form);
        data.append("action", "update");
        data.append("csrf_token", csrfToken);
        const response = await fetch(`${appBase}/api/report-edit.php`, {
          method: "POST",
          body: data,
          headers: { Accept: "application/json" },
        });
        const result = await response.json();
        if (!response.ok || !result.ok)
          throw new Error(result.message || "Update failed");
        setModal(document.getElementById("editModal"), false);
        await loadReports();
      }
      async function deleteReport() {
        if (!editingReport || !confirm("এই রিপোর্টটি ডিলিট করবেন?")) return;
        await securityReady;
        const data = new FormData();
        data.append("reportId", editingReport.id);
        data.append("action", "delete");
        data.append("csrf_token", csrfToken);
        const response = await fetch(`${appBase}/api/report-edit.php`, {
          method: "POST",
          body: data,
          headers: { Accept: "application/json" },
        });
        const result = await response.json();
        if (!response.ok || !result.ok)
          throw new Error(result.message || "Delete failed");
        location.href = `${appBase}/`;
      }

      async function voteForReport(reportId, vote, button) {
        if (button.disabled) return;
        await securityReady;
        button.disabled = true;
        const data = new FormData();
        data.append("report_id", reportId);
        data.append("vote", vote);
        data.append("csrf_token", csrfToken);
        const response = await fetch(`${appBase}/api/report-vote.php`, {
          method: "POST",
          body: data,
          headers: { Accept: "application/json" },
          cache: "no-store",
        });
        const result = await response.json();
        if (!response.ok || !result.ok)
          throw new Error(result.message || "ভোট সংরক্ষণ করা যায়নি।");
        const report = reports.find(
          (item) => String(item.id) === String(reportId),
        );
        if (report) {
          report.yes = result.yes;
          report.no = result.no;
          report.voted = true;
        }
        renderVerification();
      }

      function renderVerification() {
        const report = reports[0];
        if (!report) return;
        const section = document.getElementById("reportVerification");
        if (!section) return;
        section.innerHTML = `<p class="text-sm font-bold">এই রিপোর্টগুলো সত্য</p><div class="mt-2 flex flex-wrap items-center gap-2"><button data-vote="yes" data-report="${report.id}" ${report.voted ? "disabled" : ""} class="rounded-lg bg-green-50 px-3 py-2 text-xs font-bold text-green-700 disabled:cursor-not-allowed disabled:opacity-60">হ্যাঁ (${report.yes || 0})</button><button data-vote="no" data-report="${report.id}" ${report.voted ? "disabled" : ""} class="rounded-lg bg-red-50 px-3 py-2 text-xs font-bold text-red-700 disabled:cursor-not-allowed disabled:opacity-60">না (${report.no || 0})</button>${report.voted ? '<span class="text-xs text-slate-500">আপনি ভোট দিয়েছেন</span>' : ""}</div>`;
        section
          .querySelectorAll("[data-vote]")
          .forEach((button) =>
            button.addEventListener("click", () =>
              voteForReport(
                button.dataset.report,
                button.dataset.vote,
                button,
              ).catch((error) => alert(error.message)),
            ),
          );
      }

      function renderReports() {
        list.innerHTML = reports
          .map(
            (report) =>
              `<div class="overflow-hidden rounded-2xl border border-slate-200 bg-white p-5 shadow-sm"><div class="flex items-start justify-between gap-3"><div class="min-w-0"><div class="flex items-center gap-2"><span class="inline-block rounded-md px-2 py-1 text-[12px] font-bold ${typeStyles(report.type)}">${report.image ? '<span title="ছবি আছে" aria-label="ছবি আছে">▣</span> ' : ""}${typeLabel(report.type)}</span></div><h2 class="mt-3 text-base font-bold">${escapeHtml(report.title)}</h2></div><time class="shrink-0 text-[12px] text-slate-400">${escapeHtml(report.created_at)}</time></div><p class="mt-2 whitespace-pre-line text-sm leading-6 text-slate-600">${escapeHtml(report.description || "বিস্তারিত তথ্য দেওয়া হয়নি।")}</p><div class="mt-4 flex items-center justify-end gap-2">${report.can_edit ? `<button data-edit="${report.id}" class="rounded-lg border border-slate-200 px-3 py-2 text-xs font-bold text-slate-700">Edit</button>` : ""}${report.image ? `<button data-image="${escapeHtml(report.image)}" class="rounded-lg bg-[#5b46e8] px-3 py-2 text-xs font-bold text-white">ছবি দেখুন</button>` : ""}</div></div>`,
          )
          .join("");
        list
          .querySelectorAll("[data-image]")
          .forEach((button) =>
            button.addEventListener("click", () =>
              openImage(button.dataset.image),
            ),
          );
        list
          .querySelectorAll("[data-edit]")
          .forEach((button) =>
            button.addEventListener("click", () =>
              openEdit(
                reports.find(
                  (report) => String(report.id) === button.dataset.edit,
                ),
              ),
            ),
          );
      }

      async function loadReports() {
        if (!locationId) throw new Error("লোকেশন পাওয়া যায়নি।");
        const response = await fetch(
          `${appBase}/api/reports.php?location=${encodeURIComponent(locationId)}`,
          { headers: { Accept: "application/json" }, cache: "no-store" },
        );
        const result = await response.json();
        if (!response.ok || !result.ok)
          throw new Error(result.message || "রিপোর্ট load করা যায়নি।");

        const place = result.location;
        reportedLocation = { lat: Number(place.lat), lng: Number(place.lng) };
        if (
          reportsMap &&
          Number.isFinite(reportedLocation.lat) &&
          Number.isFinite(reportedLocation.lng)
        ) {
          reportsMap.setView([reportedLocation.lat, reportedLocation.lng], 14, {
            animate: true,
          });
          drawMarkers();
        }
        reports = result.reports;
        summary.innerHTML = `<div class="flex flex-col justify-between gap-5 border-b border-slate-200 pb-5 md:flex-row"><div><p class="mb-2 text-[12px] font-extrabold tracking-[1.5px] text-[#5b46e8]">ALL REPORTS</p><h1 class="m-0 text-3xl font-extrabold">এই লোকেশনের সব রিপোর্ট</h1><p class="mt-2 text-sm text-slate-500">${escapeHtml(place.upazila || place.station || "লোকেশন")} . ${escapeHtml(place.district || "")} . ${escapeHtml(place.division || "")}</p><p class="mt-2 text-sm font-bold text-red-500">মোট রিপোর্ট: ${Number(place.total).toLocaleString("en-US")}</p></div><div id="reportVerification" class="shrink-0 md:text-right"></div></div>`;
        renderVerification();
        renderReports();
      }
      async function loadAllLocations() {
        const response = await fetch(`${appBase}/api/locations.php`, {
          headers: { Accept: "application/json" },
          cache: "no-store",
        });
        const result = await response.json();
        if (result.ok) {
          allLocations = result.locations || [];
          initReportsMap();
        }
      }
      document.querySelectorAll(".filter-btn").forEach((button) =>
        button.addEventListener("click", () => {
          activeFilter = button.dataset.filter;
          document
            .querySelectorAll(".filter-btn")
            .forEach((item) =>
              item.classList.toggle("active", item === button),
            );
          drawMarkers();
        }),
      );
      document
        .getElementById("mapLocateBtn")
        .addEventListener("click", locateUser);
      document
        .getElementById("closeImageModal")
        .addEventListener("click", () =>
          setModal(document.getElementById("imageModal"), false),
        );
      document
        .getElementById("closeEditModal")
        .addEventListener("click", () =>
          setModal(document.getElementById("editModal"), false),
        );
      document
        .getElementById("cancelEditBtn")
        .addEventListener("click", () =>
          setModal(document.getElementById("editModal"), false),
        );
      document.getElementById("editForm").addEventListener("submit", (event) =>
        saveEdit(event).catch((error) => {
          document.getElementById("editError").textContent = error.message;
        }),
      );
      document.getElementById("deleteReportBtn").addEventListener("click", () =>
        deleteReport().catch((error) => {
          document.getElementById("editError").textContent = error.message;
        }),
      );
      Promise.all([loadReports(), loadAllLocations()]).catch((error) => {
        summary.innerHTML = "";
        list.innerHTML = `<p class="rounded-xl border border-red-100 bg-red-50 p-4 text-sm text-red-700">${escapeHtml(error.message)}</p>`;
      });
    </script>
  </body>
</html>
